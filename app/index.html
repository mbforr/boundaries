<!doctype html>

    <!--
      Vignelli: Helvetica, and only Helvetica. macOS ships Helvetica Neue, which is what the
      recording machine renders, so the deck uses the local face and loads nothing. Inter is
      the fallback for machines without it — the nearest grotesque, at the same two weights.
      Regular and Bold only; no other cut is loaded, so none can be used by accident.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
