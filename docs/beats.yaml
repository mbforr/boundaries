# The 93-beat crosswalk: every counter mark in docs/script_v3.md.
#
# Scaffolded by scripts/scaffold_beats.py (n, chapter, pen, script_line), layer
# mapping completed by hand. scripts/export_web.py revalidates on every run: all of
# 1..93 present exactly once, and every non-null layer present in the GeoPackage.
#
#   render: polygon  layer names a built GeoPackage layer
#   render: card     no geometry exists — a typographic beat. Never fake a polygon.
#   scope:  national | nyc      which export the app loads
#
# 51 polygon beats over 49 distinct layers (census_place and census_cbsa each serve
# two beats); 42 card beats. The 50th built layer, nyc_borough, is used only by the
# reveal's 'Manhattan drawn twice' scene and owns no counter mark.

